<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACSES UPI Payment Gateway</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #00baf2;
            --primary-dark: #0091ca;
            --paytm-blue: #002e6e;
            --phonepe-purple: #5f259f;
            --gpay-blue: #1a73e8;
            --bg: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.95);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 186, 242, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(95, 37, 159, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .gateway-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header-logo i {
            font-size: 28px;
            color: var(--primary);
        }

        .header-logo h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .amount-card {
            background: rgba(0, 186, 242, 0.08);
            border: 1px solid rgba(0, 186, 242, 0.2);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .amount-label {
            font-size: 13px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .amount-val {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            margin: 4px 0;
        }

        .payee-name {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
        }

        .vpa-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 24px;
        }

        .vpa-text {
            font-family: monospace;
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        #qrcode canvas, #qrcode img {
            display: block;
            margin: 0 auto;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .app-btn:active {
            transform: scale(0.98);
        }

        .btn-paytm {
            background: linear-gradient(135deg, #002e6e 0%, #00baf2 100%);
            box-shadow: 0 4px 14px rgba(0, 186, 242, 0.3);
        }

        .btn-phonepe {
            background: linear-gradient(135deg, #5f259f 0%, #8b3dff 100%);
            box-shadow: 0 4px 14px rgba(95, 37, 159, 0.3);
        }

        .btn-gpay {
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            box-shadow: 0 4px 14px rgba(26, 115, 232, 0.3);
        }

        .btn-generic {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-generic:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .notice-text {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-top: 12px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="gateway-card">
        <div class="header-logo">
            <i class="fa-solid fa-bolt"></i>
            <h1 id="merchantTitle">ACSES Payment Gateway</h1>
        </div>

        <div class="amount-card">
            <div class="amount-label">Total Payment Amount</div>
            <div class="amount-val" id="amountDisplay">₹500</div>
            <div class="payee-name" id="payeeDisplay">Payee: ACSES</div>
        </div>

        <div class="vpa-box">
            <span class="vpa-text" id="vpaDisplay">paytm.s3h7huo@pty</span>
            <button class="copy-btn" onclick="copyUPI()">
                <i class="fa-regular fa-copy"></i> <span id="copyBtnText">Copy ID</span>
            </button>
        </div>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>

        <div class="btn-group">
            <!-- Direct Paytm App Button -->
            <a id="paytmDeepBtn" class="app-btn btn-paytm" href="#">
                <i class="fa-solid fa-wallet"></i> Pay with Paytm
            </a>

            <!-- Direct PhonePe Intent -->
            <a id="phonepeDeepBtn" class="app-btn btn-phonepe" href="#">
                <i class="fa-solid fa-mobile-screen"></i> Pay with PhonePe
            </a>

            <!-- Direct Google Pay Intent -->
            <a id="gpayDeepBtn" class="app-btn btn-gpay" href="#">
                <i class="fa-brands fa-google-pay"></i> Pay with Google Pay
            </a>

            <!-- Universal UPI Choice -->
            <a id="universalUpiBtn" class="app-btn btn-generic" href="#">
                <i class="fa-solid fa-qrcode"></i> Open Any UPI App
            </a>
        </div>

        <p class="notice-text">
            <i class="fa-solid fa-lock"></i> Secured via UPI Gateway. After completing payment, return to your Google Form to upload screenshot & UTR reference.
        </p>
    </div>

    <div id="toast" class="toast">UPI ID Copied to Clipboard!</div>

    <script>
        // Extract parameters from URL query string or set default
        const urlParams = new URLSearchParams(window.location.search);
        const upiId = urlParams.get('pa') || 'paytm.s3h7huo@pty';
        const payeeName = urlParams.get('pn') || 'ACSES';
        const amount = urlParams.get('am') || '500';
        const currency = urlParams.get('cu') || 'INR';

        // Update DOM Text
        document.getElementById('vpaDisplay').innerText = upiId;
        document.getElementById('payeeDisplay').innerText = `Payee: ${payeeName}`;
        document.getElementById('amountDisplay').innerText = `₹${amount}`;

        // Build UPI URLs
        const upiStandardUrl = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${encodeURIComponent(amount)}&cu=${currency}`;
        
        // App specific scheme links
        const paytmSchemeUrl = `paytmmp://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${encodeURIComponent(amount)}&cu=${currency}`;
        
        // Android Intent links (Forces launch of specific apps even for merchant IDs)
        const gpayIntentUrl = `intent://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${encodeURIComponent(amount)}&cu=${currency}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`;
        const phonepeIntentUrl = `intent://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${encodeURIComponent(amount)}&cu=${currency}#Intent;scheme=upi;package=com.phonepe.app;end`;

        // Set Element Hrefs
        document.getElementById('paytmDeepBtn').href = paytmSchemeUrl;
        document.getElementById('phonepeDeepBtn').href = phonepeIntentUrl;
        document.getElementById('gpayDeepBtn').href = gpayIntentUrl;
        document.getElementById('universalUpiBtn').href = upiStandardUrl;

        // Render Dynamic QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: upiStandardUrl,
            width: 170,
            height: 170,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        // Copy UPI function
        function copyUPI() {
            navigator.clipboard.writeText(upiId).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }).catch(err => {
                alert('UPI ID: ' + upiId);
            });
        }

        // Auto-redirect if accessed from mobile browser with Paytm flag
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile && urlParams.get('autoredirect') === 'true') {
            window.location.href = paytmSchemeUrl;
        }
    </script>
</body>

</html>
